version: 1
project:
  type: django
  profile: normal
github:
  enabled: true
  use_issues: true
  merge_method: squash
  squash_merge_commit_message: pr-title-description
  delete_branch_on_merge: true
git:
  conventional_commits: true
commands:
  test: .venv/bin/python manage.py test rc --settings=recast.test_settings
  check: ./scripts/check
